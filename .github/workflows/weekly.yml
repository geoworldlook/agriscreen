# Weekly run: new Sentinel-2 scenes, ERA5-Land, SWI and weather -> vineyard statistics, tests, validation -> panel.
# The pipeline state (scenes, caches, registry, ISMN sensor files) lives in the PRIVATE repository
# geoworldlook/agriscreen-data, because the ISMN terms forbid passing the sensor data on. This workflow checks it out,
# runs `python -m agriscreen weekly`, publishes the panel to docs/showcase (GitHub Pages) and pushes the new state back.
# Any failure opens (or updates) an issue. Setup: docs/URUCHOMIENIE_GITHUB_ACTIONS.md.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   AGRISCREEN_DATA_TOKEN   fine-grained token with Contents: read and write on geoworldlook/agriscreen-data only
#   EE_SERVICE_ACCOUNT_KEY  JSON key of a Google Cloud service account registered for Earth Engine
#   CDSE_CLIENT_ID, CDSE_CLIENT_SECRET   Copernicus Data Space (Sentinel Hub) OAuth client, for the SWI series
# Variable (optional): EE_PROJECT, default ee-geoworldlook.
name: weekly

on:
  schedule:
    # Monday and Thursday 05:30 UTC. GitHub sometimes skips scheduled jobs under load; the run is incremental,
    # so a second run in a week only adds what is new.
    - cron: "30 5 * * 1"
    - cron: "30 5 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AGRISCREEN_DATA_DIR: ${{ github.workspace }}/agriwatch
      EE_PROJECT: ${{ vars.EE_PROJECT || 'ee-geoworldlook' }}
      EE_SERVICE_ACCOUNT_KEY: ${{ github.workspace }}/secrets/ee_service_account.json
    steps:
      - name: Check secrets
        env:
          T: ${{ secrets.AGRISCREEN_DATA_TOKEN }}
          K: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          I: ${{ secrets.CDSE_CLIENT_ID }}
          S: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$T" ] || missing="$missing AGRISCREEN_DATA_TOKEN"
          [ -n "$K" ] || missing="$missing EE_SERVICE_ACCOUNT_KEY"
          [ -n "$I" ] || missing="$missing CDSE_CLIENT_ID"
          [ -n "$S" ] || missing="$missing CDSE_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see docs/URUCHOMIENIE_GITHUB_ACTIONS.md)"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          path: code
      - name: Check out the data (private repository)
        uses: actions/checkout@v4
        with:
          repository: geoworldlook/agriscreen-data
          token: ${{ secrets.AGRISCREEN_DATA_TOKEN }}
          path: agriwatch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - name: Install
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest]" matplotlib
      - name: Write keys (outside both repositories)
        env:
          K: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          I: ${{ secrets.CDSE_CLIENT_ID }}
          S: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          mkdir -p secrets && chmod 700 secrets
          printf '%s' "$K" > secrets/ee_service_account.json
          printf 'CDSE_CLIENT_ID=%s\nCDSE_CLIENT_SECRET=%s\n' "$I" "$S" > secrets/cdse.env
          chmod 600 secrets/*
      - name: Run and publish the panel
        working-directory: code
        run: |
          git config user.name "Dawid"
          git config user.email "160788003+geoworldlook@users.noreply.github.com"
          python -m agriscreen weekly --no-pull
      - name: Check the run summary
        run: |
          python - <<'PY'
          import json, os, sys
          s = json.load(open(os.path.join(os.environ["AGRISCREEN_DATA_DIR"], "data", "logs", "last_weekly.json"), encoding="utf-8"))
          print(json.dumps(s, ensure_ascii=False, indent=1))
          errors = [k for k, v in s.get("tasks", {}).items() if v == "error"]
          pub = str(s.get("publish", ""))
          if errors:
              sys.exit(f"tasks with errors: {', '.join(errors)}")
          if "nieudany" in pub or "błąd" in pub or s.get("tasks", {}).get("panel") != "ok":
              sys.exit(f"panel not published: {pub}")
          PY
      - name: Push the new state to the data repository
        if: always()
        working-directory: agriwatch
        run: |
          git config user.name "Dawid"
          git config user.email "160788003+geoworldlook@users.noreply.github.com"
          rm -f data/registry/.agriscreen.lock
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "auto: weekly run $(date -u +%F)"
            ok=0
            for attempt in 1 2 3; do
              if git pull --rebase -q && git push -q; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1
          fi
      - name: Remove keys
        if: always()
        run: rm -rf secrets
      - name: Close the failure issue after a successful run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --state open --search "Weekly run failed in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "${{ github.repository }}" --comment "Recovered: the run on $(date -u +%F) succeeded. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly run failed"
          body="The weekly run failed on $(date -u +%F). Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
