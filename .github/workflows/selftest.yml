# CI: every push and pull request runs the linter and the offline end-to-end test on synthetic data
# (no network, no keys). The weekly job only publishes the panel; it does not need this to pass.
name: selftest

on:
  push:
    branches: [main]
    paths-ignore: ["docs/showcase/**", "notebooks/AgriScreen_story.ipynb"]   # weekly panel updates
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . matplotlib ruff
      - name: Lint (ruff)
        run: ruff check agriscreen notebooks --exclude "*.ipynb"
      - name: Offline end-to-end test
        run: python -m agriscreen selftest --out "$RUNNER_TEMP/agriscreen_selftest"
